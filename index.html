<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>감정 발사기</title>
<meta property="og:type" content="website">
<meta property="og:title" content="감정 발사기">
<meta property="og:description" content="마음에 걸렸던 일을 적고, 느꼈던 감정을 골라 시원하게 날려버리세요.">
<meta property="og:image" content="https://jongdash.github.io/Emotion_Launcher/thumbnail.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://jongdash.github.io/Emotion_Launcher/">
<meta name="twitter:card" content="summary_large_image">

<meta http-equiv="refresh" content="0; url=https://script.google.com/macros/s/AKfycbwdHgXAGLk0hwq1zDHehcQBGszS24IZklRsGi5U4sATWnqpH7Rbk66vO6ZbbyhR-kpr/exec">
<style>
  html,body{height:100%;margin:0}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;background:#fff;
    font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}
  .wrap{position:relative;width:84px;height:84px}
  /* 썸네일 구슬처럼 번지는 빛 */
  .wrap::before{content:'';position:absolute;inset:-26px;border-radius:50%;
    background:radial-gradient(circle,rgba(190,170,255,.32),rgba(190,170,255,0) 68%)}
  /* 자홍 → 보라 → 파랑으로 이어지는 원형 로딩 링 */
  .ring{position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(from 0deg,rgba(231,165,255,0) 0deg,#E7A5FF 70deg,#C25BE8 160deg,#6E4BF0 250deg,#3D6BFF 330deg,rgba(61,107,255,0) 360deg);
    -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));
            mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));
    filter:blur(.6px);animation:spin 1.1s linear infinite}
  .ring.glow{filter:blur(9px);opacity:.55}
  @keyframes spin{to{transform:rotate(360deg)}}
  .label{font-size:15px;font-weight:600;letter-spacing:.14em;color:#8B7FC9}
  .label i{font-style:normal;animation:dot 1.4s infinite}
  .label i:nth-child(2){animation-delay:.2s} .label i:nth-child(3){animation-delay:.4s}
  @keyframes dot{0%,20%{opacity:.15}50%{opacity:1}100%{opacity:.15}}
  @media (prefers-reduced-motion:reduce){.ring{animation-duration:3s}.label i{animation:none}}
</style>
</head>
<body>
  <div class="wrap" role="progressbar" aria-label="Loading"><div class="ring glow"></div><div class="ring"></div></div>
  <div class="label">Loading<i>.</i><i>.</i><i>.</i></div>
  <script>location.replace('https://script.google.com/macros/s/AKfycbwdHgXAGLk0hwq1zDHehcQBGszS24IZklRsGi5U4sATWnqpH7Rbk66vO6ZbbyhR-kpr/exec');</script>
</body>
</html>
